openapi: 3.0.3
info:
  title: Exchange Rate API
  version: 0.1.0
  description: Lists supported currencies and returns each one's current exchange rate to USD.
servers:
  - url: /
paths:
  /currencies:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listCurrencies
      summary: List supported currencies
      responses:
        '200':
          description: Paginated list of supported currencies
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Currency' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
          description: max items to return
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
          description: items to skip
        - name: search
          in: query
          schema: { type: string }
          description: filter by currency code or name
  /currencies/{code}/rate:
    parameters:
      - $ref: '#/components/parameters/CurrencyCode'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getCurrencyRate
      summary: Get the current USD exchange rate for a currency
      responses:
        '200':
          description: Current rate for the requested currency
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeRate' }
        '400':
          description: Invalid currency code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Currency not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: caller identity injected by the gateway from the validated token
      schema: { type: string }
    CurrencyCode:
      name: code
      in: path
      required: true
      description: ISO 4217 currency code, e.g. EUR
      schema: { type: string }
  schemas:
    Currency:
      type: object
      required: [code, name]
      properties:
        code: { type: string, description: ISO 4217 currency code }
        name: { type: string, description: currency display name }
    ExchangeRate:
      type: object
      required: [currencyCode, rateToUsd, asOfDate]
      properties:
        currencyCode: { type: string, description: ISO 4217 currency code }
        rateToUsd: { type: number, description: units of this currency per 1 USD }
        asOfDate: { type: string, format: date, description: date this rate was last refreshed }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
security:
  - bearerAuth: []
